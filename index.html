<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Celda de litio en tres escalas, de la celda 18650 a la red cristalina. Laboratorio de Ciencias 3D, Universidad Austral de Chile.">
<title>Celda 18650</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Chivo:wght@400;500;700&display=swap">
<style>
/* Escalera de escala arriba como navegación y como indicador; lienzo a sangre;
   lecturas a la izquierda; controles de carga abajo. Paleta tomada de los
   propios materiales: cobre, aluminio, grafito y el verde del litio. */
:root{
  color-scheme: dark;
  --fondo:   #07090c;
  --panel:   #10151b;
  --borde:   #222c36;
  --texto:   #e8eef3;
  --tenue:   #8496a4;
  --cobre:   #c87f3e;
  --litio:   #7ce3a6;
  --oxido:   #5b8fd6;
  --display: "Chivo", "Helvetica Neue", Arial, sans-serif;
  --dato:    "Chivo Mono", "SFMono-Regular", Menlo, monospace;
}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--texto);
  font-family:var(--display); overflow:hidden; -webkit-font-smoothing:antialiased;
}
canvas{display:block; touch-action:none}
[hidden]{display:none!important}
#escena{position:fixed; inset:0}

/* ---------- escalera de escala ---------- */
#escalera{
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0;
  display:flex; gap:0; padding:10px 14px 0;
  background:linear-gradient(to bottom, rgba(7,9,12,.92), transparent);
}
.peldano{
  flex:1 1 0; min-width:0; background:none; border:0; cursor:pointer;
  text-align:left; padding:7px 0 9px; color:var(--tenue);
  border-top:2px solid var(--borde); transition:color .18s, border-color .18s;
}
.peldano:hover{color:var(--texto)}
.peldano[aria-current="true"]{color:var(--texto); border-top-color:var(--litio)}
.peldano b{display:block; font-size:13px; font-weight:700; letter-spacing:.01em}
.peldano span{display:block; font-family:var(--dato); font-size:10.5px; margin-top:1px}
.peldano:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--litio); outline-offset:2px}

/* ---------- lecturas ---------- */
#lectura{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 74px); left:0;
  padding:0 16px; pointer-events:none; max-width:min(90vw,320px);
}
#rotulo{font-size:19px; font-weight:700; margin:0 0 3px; text-wrap:balance}
#glosa{font-size:12.5px; color:var(--tenue); line-height:1.5; margin:0 0 14px}
#ecuacion{
  font-family:var(--dato); font-size:11.5px; line-height:1.75; color:var(--litio);
  background:rgba(16,21,27,.74); border:1px solid var(--borde);
  border-radius:3px; padding:8px 10px; margin-bottom:12px;
}
.cifras{display:grid; grid-template-columns:auto auto; gap:3px 14px; font-size:12px; margin:0}
.cifras dt{color:var(--tenue)}
.cifras dd{margin:0; font-family:var(--dato); font-variant-numeric:tabular-nums}

/* ---------- controles ---------- */
#mandos{
  position:fixed; left:0; right:0; bottom:0;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, rgba(7,9,12,.95), rgba(7,9,12,.8) 68%, transparent);
  display:flex; flex-direction:column; gap:10px;
}
#estado{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
#barra{
  flex:1 1 180px; height:7px; min-width:120px; border-radius:4px;
  background:var(--borde); overflow:hidden; position:relative;
}
#relleno{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,var(--cobre),var(--litio)); width:50%}
#soc{font-family:var(--dato); font-size:12px; font-variant-numeric:tabular-nums; min-width:112px}
#fila{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
button.b{
  font-family:var(--display); font-weight:500; font-size:12.5px;
  background:transparent; color:var(--texto);
  border:1px solid var(--borde); border-radius:2px;
  padding:7px 13px; cursor:pointer; transition:border-color .15s, color .15s;
}
button.b:hover{border-color:var(--litio); color:var(--litio)}
button.b[aria-pressed="true"]{border-color:var(--litio); color:var(--litio)}
.mando{display:flex; flex-direction:column; gap:3px; flex:0 1 160px}
.mando label{
  font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--tenue);
  display:flex; justify-content:space-between; gap:8px;
}
.mando label span{font-family:var(--dato); letter-spacing:0; color:var(--texto); text-transform:none}
input[type=range]{width:100%; accent-color:var(--litio); margin:0}
#pista{font-size:11px; color:var(--tenue); line-height:1.4; flex-basis:100%}
#vrhost button{
  font-family:var(--display)!important; font-weight:500!important; font-size:12.5px!important;
  border-radius:2px!important; background:transparent!important; color:var(--litio)!important;
  border:1px solid var(--litio)!important; padding:7px 13px!important;
  position:static!important; width:auto!important; left:auto!important; bottom:auto!important;
  transform:none!important; opacity:1!important; cursor:pointer;
}
#vrhost button[disabled]{border-color:var(--borde)!important; color:var(--tenue)!important; cursor:default}

#cargando{
  position:fixed; inset:0; display:grid; place-items:center; z-index:5;
  background:var(--fondo); font-family:var(--dato); font-size:12px; color:var(--tenue);
  transition:opacity .5s;
}
@media (max-width:640px){
  #lectura{max-width:none; padding:0 14px}
  #glosa{display:none}
  .peldano b{font-size:11.5px}
  .peldano span{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="escena"></div>

<div id="escalera" role="group" aria-label="Escala"></div>

<div id="lectura">
  <p id="rotulo">La celda</p>
  <p id="glosa"></p>
  <div id="ecuacion"></div>
  <dl class="cifras">
    <dt>escala</dt><dd id="c-esc">—</dd>
    <dt>campo</dt><dd id="c-campo">—</dd>
    <dt>tensión</dt><dd id="c-v">—</dd>
    <dt id="t-extra">capacidad</dt><dd id="c-extra">—</dd>
  </dl>
</div>

<div id="mandos">
  <div id="estado">
    <button class="b" id="b-descarga" aria-pressed="false">Descargar</button>
    <button class="b" id="b-carga" aria-pressed="false">Cargar</button>
    <div id="barra"><div id="relleno"></div></div>
    <span id="soc">50 % · 3,70 V</span>
  </div>
  <div id="fila">
    <button class="b" id="b-desarmar">Desarmar</button>
    <button class="b" id="b-etiquetas" aria-pressed="true">Rótulos</button>
    <div class="mando">
      <label for="vel">Velocidad <span id="v-vel">1,0×</span></label>
      <input type="range" id="vel" min="0.2" max="3" step="0.1" value="1">
    </div>
    <span id="vrhost"></span>
  </div>
  <p id="pista">Arrastra para girar · rueda para acercarte</p>
</div>

<div id="cargando">construyendo la celda…</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* =====================================================================
   Medidas reales de una celda cilíndrica 18650 con ánodo de grafito y
   cátodo de óxido laminar. Todo lo que se dibuja sale de estos números.
   ===================================================================== */
const CELDA = { diam:18, alto:65, vNom:3.70, vMax:4.20, vMin:3.00, mAh:3000 };
const CAPAS = [                                   // espesores en micrones
  { id:'cu',  nom:'Colector de cobre',    um:9,  color:0xc87f3e },
  { id:'gr',  nom:'Grafito (ánodo)',      um:70, color:0x3b4249 },
  { id:'sep', nom:'Separador PP/PE',      um:20, color:0x9fb0bd },
  { id:'ox',  nom:'Óxido laminar (cátodo)', um:60, color:0x3f6ea8 },
  { id:'al',  nom:'Colector de aluminio', um:14, color:0xc3cbd2 },
];
const RED = {                                     // distancias en nanómetros
  cc: 0.142,            // enlace carbono-carbono
  d002: 0.335,          // separación entre planos de grafito
  d002Li: 0.370,        // la misma separación con litio intercalado (LiC6)
  rLi: 0.076,           // radio iónico del litio
  interSlab: 0.47,      // hueco entre láminas de MO2
};

/* --- estado de la celda. Se declara antes que la geometría porque la red
   cristalina se dibuja en función del estado de carga: la separación entre
   planos de grafito depende de cuánto litio haya intercalado. --- */
let soc = 0.5;                 // 1 = cargada (litio en el grafito)
let corriente = 0;             // -1 descarga, +1 carga
let velocidad = 1;
let tramo = 0;                 // 0 celda · 1 capas · 2 red
let desarmado = 0, desarmando = 0;

/* --------------------------- escena --------------------------- */
const host = document.getElementById('escena');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
host.appendChild(renderer.domElement);

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x07090c);
const camara = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.05, 2000);
const rig = new THREE.Group(); rig.add(camara); escena.add(rig);

escena.add(new THREE.HemisphereLight(0xaecbe0, 0x12171d, 0.9));
const luz1 = new THREE.DirectionalLight(0xffffff, 2.1); luz1.position.set(40,60,45); escena.add(luz1);
const luz2 = new THREE.DirectionalLight(0x7ce3a6, 0.55); luz2.position.set(-50,-18,-30); escena.add(luz2);
const luz3 = new THREE.DirectionalLight(0xc87f3e, 0.45); luz3.position.set(30,-40,-25); escena.add(luz3);

/* --------------------------- rótulos --------------------------- */
const listaRotulos = [];
let verRotulos = true;

function hacerRotulo(texto, sub, ancho = 6){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.font = '500 40px Chivo, Helvetica, Arial, sans-serif';
  x.fillStyle = '#eef4f8'; x.textBaseline = 'middle';
  x.shadowColor = 'rgba(0,0,0,.9)'; x.shadowBlur = 12;
  x.fillText(texto, 8, sub ? 42 : 64);
  if (sub){
    x.font = '400 30px "Chivo Mono", monospace';
    x.fillStyle = '#8fa4b2';
    x.fillText(sub, 8, 88);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(ancho, ancho/4),
    new THREE.MeshBasicMaterial({ map:t, transparent:true, depthWrite:false })
  );
  m.renderOrder = 5;
  listaRotulos.push(m);
  return m;
}

/* =====================================================================
   TRAMO 1 — la celda y su desarme
   ===================================================================== */
const gCelda = new THREE.Group(); escena.add(gCelda);

const matAcero = new THREE.MeshStandardMaterial({ color:0x8e9aa4, roughness:0.38, metalness:0.92 });
const matFunda = new THREE.MeshStandardMaterial({ color:0x1d4f78, roughness:0.62, metalness:0.1 });
const matBorne = new THREE.MeshStandardMaterial({ color:0xb9c3cb, roughness:0.3, metalness:0.95 });

const carcasa = new THREE.Group();
const lata = new THREE.Mesh(
  new THREE.CylinderGeometry(CELDA.diam/2, CELDA.diam/2, CELDA.alto, 64, 1, true), matAcero);
lata.material.side = THREE.DoubleSide;
carcasa.add(lata);
const funda = new THREE.Mesh(
  new THREE.CylinderGeometry(CELDA.diam/2+0.14, CELDA.diam/2+0.14, CELDA.alto*0.82, 64, 1, true), matFunda);
funda.material.side = THREE.DoubleSide;
carcasa.add(funda);
const tapa = new THREE.Mesh(new THREE.CylinderGeometry(CELDA.diam/2, CELDA.diam/2, 1.2, 64), matAcero);
tapa.position.y = CELDA.alto/2;
const borne = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 1.6, 40), matBorne);
borne.position.y = CELDA.alto/2 + 1.2;
const base = new THREE.Mesh(new THREE.CylinderGeometry(CELDA.diam/2, CELDA.diam/2, 1.2, 64), matAcero);
base.position.y = -CELDA.alto/2;
carcasa.add(tapa, borne, base);
gCelda.add(carcasa);

/* el rollo: una espiral de dos electrodos enrollados con el separador */
const rollo = new THREE.Group();
function cintaEnrollada(radio0, vueltas, desfase, color, grosor){
  const pts = [];
  const n = 260;
  for (let i=0; i<=n; i++){
    const a = (i/n) * vueltas * Math.PI*2;
    const r = radio0 + (i/n) * (CELDA.diam/2 - 1.6 - radio0);
    pts.push(new THREE.Vector3(Math.cos(a+desfase)*r, 0, Math.sin(a+desfase)*r));
  }
  const curva = new THREE.CatmullRomCurve3(pts);
  const g = new THREE.TubeGeometry(curva, 420, grosor, 4, false);
  g.scale(1, CELDA.alto*0.88/(grosor*2), 1);
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color, roughness:0.7, metalness:0.25, side:THREE.DoubleSide }));
}
rollo.add(cintaEnrollada(1.4, 7, 0,          0xc87f3e, 0.12));   // cobre + grafito
rollo.add(cintaEnrollada(1.4, 7, Math.PI*0.5, 0x9fb0bd, 0.07));  // separador
rollo.add(cintaEnrollada(1.4, 7, Math.PI,     0x3f6ea8, 0.12));  // óxido + aluminio
rollo.visible = false;
gCelda.add(rollo);

/* =====================================================================
   TRAMO 2 — el apilado de capas, con los espesores reales
   ===================================================================== */
const gCapas = new THREE.Group(); gCapas.visible = false; escena.add(gCapas);
const ESC_CAPA = 0.34;                        // unidades de escena por micrón
const ANCHO = 56, FONDO = 34;
let yCapa = 0;
const totalUm = CAPAS.reduce((a,c) => a + c.um, 0);
let acum = -totalUm/2;
for (const capa of CAPAS){
  const alto = capa.um * ESC_CAPA;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(ANCHO, alto, FONDO),
    new THREE.MeshStandardMaterial({
      color:capa.color,
      roughness: capa.id==='cu'||capa.id==='al' ? 0.3 : 0.85,
      metalness: capa.id==='cu'||capa.id==='al' ? 0.9 : 0.1,
      transparent: capa.id==='sep', opacity: capa.id==='sep' ? 0.55 : 1 })
  );
  m.position.y = (acum + capa.um/2) * ESC_CAPA;
  capa.mesh = m;
  gCapas.add(m);
  const r = hacerRotulo(capa.nom, capa.um + ' µm', 26);
  r.position.set(ANCHO/2 + 15, m.position.y, 0);
  capa.rotulo = r;
  gCapas.add(r);
  acum += capa.um;
}

/* =====================================================================
   TRAMO 3 — la red cristalina y el tránsito del litio
   ===================================================================== */
const gRed = new THREE.Group(); gRed.visible = false; escena.add(gRed);
const ESC_NM = 46;                            // unidades de escena por nanómetro
const N_SITIOS = 72;                          // sitios de litio por electrodo

const geoAtomo = new THREE.IcosahedronGeometry(1, 1);
const geoEnlace = new THREE.CylinderGeometry(1, 1, 1, 5, 1, true);

function instanciar(geo, color, n, extra = {}){
  const m = new THREE.InstancedMesh(geo,
    new THREE.MeshStandardMaterial({ color, roughness:0.46, metalness:0.12, ...extra }), n);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.count = 0;
  gRed.add(m);
  return m;
}

const dummy = new THREE.Object3D();
const X_ANODO = -16, X_CATODO = 16;           // centros de cada electrodo

/* --- grafito: planos de panal apilados (apilamiento AB) --- */
const HOJAS = 5, NX = 4, NY = 3;
const carbonos = [];
for (let h=0; h<HOJAS; h++){
  const fila = [];
  for (let i=-NX; i<=NX; i++){
    for (let j=-NY; j<=NY; j++){
      const bx = i * RED.cc * 3, bz = j * RED.cc * Math.sqrt(3);
      fila.push([bx, bz]);
      fila.push([bx + RED.cc, bz]);
      fila.push([bx + RED.cc*1.5, bz + RED.cc*Math.sqrt(3)/2]);
      fila.push([bx + RED.cc*2.5, bz + RED.cc*Math.sqrt(3)/2]);
    }
  }
  carbonos.push(fila);
}
const nCarbono = carbonos.reduce((a,f) => a + f.length, 0);
const mallaC = instanciar(geoAtomo, 0x8c99a3, nCarbono);

/* --- óxido laminar: láminas de MO2 separadas por el hueco del litio --- */
const SLABS = 5, OX = 6, OZ = 4;
const A_OX = 0.282;              // distancia metal-metal en el plano, en nm
const nSitiosM = SLABS*(2*OX+1)*(2*OZ+1);
const mallaM = instanciar(geoAtomo, 0x4a7fc0, nSitiosM);
const mallaO = instanciar(geoAtomo, 0xc9574e, nSitiosM*2);

/* --- litio y electrones --- */
const mallaLi = instanciar(geoAtomo, 0x7ce3a6, 200,
  { emissive:0x1f6b44, emissiveIntensity:0.75, roughness:0.28 });
const mallaE = instanciar(geoAtomo, 0xffd9a0, 32,
  { emissive:0x7a4a10, emissiveIntensity:0.9 });

/* separador translúcido entre los dos electrodos */
const separador = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(13, 26, 20)),
  new THREE.LineBasicMaterial({ color:0x6f8494, transparent:true, opacity:0.45 }));
gRed.add(separador);

/* arco del circuito externo con su ampolleta */
const arco = new THREE.Mesh(
  new THREE.TorusGeometry(16, 0.18, 8, 90, Math.PI),
  new THREE.MeshStandardMaterial({ color:0x55636e, roughness:0.5, metalness:0.6 }));
arco.position.y = 10; arco.rotation.z = Math.PI;
gRed.add(arco);
const bombilla = new THREE.Mesh(
  new THREE.SphereGeometry(1.7, 24, 16),
  new THREE.MeshStandardMaterial({ color:0x3a3f45, emissive:0xffcf73, emissiveIntensity:0 }));
bombilla.position.set(0, 26, 0);
gRed.add(bombilla);

const rotAnodo  = hacerRotulo('Ánodo · grafito', 'LiC₆ ⇌ C₆ + Li⁺ + e⁻', 17);
rotAnodo.position.set(X_ANODO, -16, 0);
const rotCatodo = hacerRotulo('Cátodo · óxido laminar', 'Li₁₋ₓMO₂ + xLi⁺ + xe⁻ ⇌ LiMO₂', 17);
rotCatodo.position.set(X_CATODO, -16, 0);
const rotSep = hacerRotulo('Separador + electrolito', 'LiPF₆ en EC/DMC', 12);
rotSep.position.set(0, 18, 0);
gRed.add(rotAnodo, rotCatodo, rotSep);

/* ---- sitios de litio ----
   Se guardan como coordenadas de red, no como posiciones fijas: la
   separación entre planos de grafito cambia con el estado de carga, y los
   iones tienen que seguir quedando ENTRE los planos, no atravesándolos. */
const redAnodo = [], redCatodo = [];
for (let h=0; h<HOJAS-1; h++)
  for (let i=-3; i<=3; i++)
    for (let j=-1; j<=1; j++) redAnodo.push({h, i, j});
for (let s=0; s<SLABS-1; s++)
  for (let i=-3; i<=3; i++)
    for (let j=-1; j<=1; j++) redCatodo.push({s, i, j});

/* Las dos redes se exageran con el MISMO factor: si no, la razón entre la
   separación del grafito (0,335 nm) y la del óxido (0,47 nm) saldría falsa. */
const EXAG = 2.4;
const DZ_SLAB = RED.interSlab * (ESC_NM/10) * EXAG;

function dAnodo(){ return (RED.d002 + (RED.d002Li - RED.d002) * soc) * (ESC_NM/10) * EXAG; }
function posAnodo(k, v = new THREE.Vector3()){
  const s = redAnodo[k % redAnodo.length], d = dAnodo();
  return v.set(X_ANODO + s.i * 1.55, (s.h + 0.5 - (HOJAS-1)/2) * d, s.j * 1.55);
}
function posCatodo(k, v = new THREE.Vector3()){
  const s = redCatodo[k % redCatodo.length];
  return v.set(X_CATODO + s.i * 1.55, (s.s + 0.5 - (SLABS-1)/2) * DZ_SLAB, s.j * 1.55);
}

/* cada ion sabe en qué electrodo está y, si va cruzando, por dónde va */
const iones = [];
for (let k=0; k<N_SITIOS; k++)
  iones.push({ pos:posAnodo(k), destino:new THREE.Vector3(), origen:new THREE.Vector3(),
               u:1, lado:'anodo', idx:k });
const electrones = [];
for (let k=0; k<26; k++) electrones.push({ u: k/26 });

function dibujarRed(){
  const d = dAnodo();
  let n = 0;
  for (let h=0; h<HOJAS; h++){
    const y = (h - (HOJAS-1)/2) * d;
    const desplaza = (h % 2) ? RED.cc : 0;          // apilamiento AB
    for (const [bx, bz] of carbonos[h]){
      dummy.position.set(X_ANODO + (bx+desplaza)*ESC_NM/10, y, bz*ESC_NM/10);
      dummy.scale.setScalar(0.22);
      dummy.updateMatrix();
      mallaC.setMatrixAt(n++, dummy.matrix);
    }
  }
  mallaC.count = n; mallaC.instanceMatrix.needsUpdate = true;

  let nm = 0, no = 0;
  for (let s=0; s<SLABS; s++){
    const y = (s - (SLABS-1)/2) * DZ_SLAB;
    for (let i=-OX; i<=OX; i++){
      for (let j=-OZ; j<=OZ; j++){
        const x = X_CATODO + i*A_OX*(ESC_NM/10), z = j*A_OX*(ESC_NM/10)*0.95;
        dummy.position.set(x, y, z); dummy.scale.setScalar(0.34); dummy.updateMatrix();
        mallaM.setMatrixAt(nm++, dummy.matrix);
        for (const dy of [-0.55, 0.55]){           // oxígenos arriba y abajo del metal
          dummy.position.set(x + 0.32, y + dy, z + 0.36);
          dummy.scale.setScalar(0.24); dummy.updateMatrix();
          mallaO.setMatrixAt(no++, dummy.matrix);
        }
      }
    }
  }
  mallaM.count = nm; mallaM.instanceMatrix.needsUpdate = true;
  mallaO.count = no; mallaO.instanceMatrix.needsUpdate = true;
}

/* =====================================================================
   estado de carga
   ===================================================================== */
function tension(){
  // perfil con meseta: casi plano en la zona central y caída marcada al final,
  // que es como se comporta una celda de óxido laminar
  const f = 0.72*soc + 0.28*Math.pow(soc, 0.35);
  return Math.min(CELDA.vMax, CELDA.vMin + (CELDA.vMax - CELDA.vMin) * f);
}

function moverIones(dt){
  const paso = dt * velocidad;
  const objetivoAnodo = Math.round(soc * N_SITIOS);
  let enAnodo = iones.filter(i => i.lado === 'anodo' && i.u >= 1).length;

  for (const ion of iones){
    if (ion.u >= 1 && ion.lado === 'anodo') posAnodo(ion.idx, ion.pos);
    if (ion.u < 1){                                  // en tránsito
      ion.u = Math.min(1, ion.u + paso * 0.5);
      const t = ion.u * ion.u * (3 - 2*ion.u);
      ion.pos.lerpVectors(ion.origen, ion.destino, t);
      // arquea el paso por el electrolito para que se lea el cruce
      ion.pos.y += Math.sin(ion.u * Math.PI) * 3.2;
      if (ion.u >= 1) ion.pos.copy(ion.destino);
      continue;
    }
    if (!corriente) continue;
    const quiereIr = corriente < 0 ? (ion.lado === 'anodo' && enAnodo > objetivoAnodo)
                                   : (ion.lado === 'catodo' && enAnodo < objetivoAnodo);
    if (quiereIr && Math.random() < paso * 2.2){
      ion.origen.copy(ion.pos);
      if (ion.lado === 'anodo'){ ion.lado = 'catodo'; posCatodo(ion.idx, ion.destino); enAnodo--; }
      else { ion.lado = 'anodo'; posAnodo(ion.idx, ion.destino); enAnodo++; }
      ion.u = 0;
    }
  }

  let n = 0;
  for (const ion of iones){
    dummy.position.copy(ion.pos);
    dummy.scale.setScalar(ion.u < 1 ? 0.42 : 0.34);
    dummy.updateMatrix();
    mallaLi.setMatrixAt(n++, dummy.matrix);
  }
  mallaLi.count = n; mallaLi.instanceMatrix.needsUpdate = true;

  // electrones por el arco, en el mismo sentido que los iones
  let ne = 0;
  for (const e of electrones){
    if (corriente) e.u = (e.u + paso * 0.22 * (corriente < 0 ? 1 : -1) + 1) % 1;
    const a = Math.PI * e.u;
    dummy.position.set(-Math.cos(a) * 13, 9 + Math.sin(a) * 13, 0);
    dummy.scale.setScalar(0.3); dummy.updateMatrix();
    mallaE.setMatrixAt(ne++, dummy.matrix);
  }
  mallaE.count = ne; mallaE.instanceMatrix.needsUpdate = true;
  bombilla.material.emissiveIntensity = corriente < 0 ? 1.6 : 0;
}

/* =====================================================================
   tramos y lecturas
   ===================================================================== */
/* El aumento no se escribe a mano: se deriva del factor de conversión de cada
   tramo, tomando 1 unidad de escena = 1 metro, que es lo que hará el visor. */
const aumento = uPorUnidad => {
  const n = Math.round(uPorUnidad);
  const esp = v => v.toLocaleString('es-CL').replace(/\./g, ' ');
  if (n >= 1e9) return '×' + esp(Math.round(n/1e6)) + ' millones';
  return '×' + esp(n);
};
const ESC_CELDA = 1;                      // unidades por milímetro
const TRAMOS = [
  { nom:'La celda',       sub:'18 × 65 mm · ×1 000',
    glosa:'Una 18650: dos electrodos y un separador enrollados en espiral dentro de una lata de acero. Desármala para ver qué hay adentro.',
    eq:'LiC₆ + Li₁₋ₓMO₂ ⇌ C₆ + LiMO₂',
    campo:'65 mm', esc:aumento(ESC_CELDA/1e-3), radio:120 },
  { nom:'Las capas',      sub:'173 µm · ×340 000',
    glosa:'Desenrollado, el electrodo es un sándwich. El cobre va siempre del lado del grafito y el aluminio del lado del óxido: el cobre se oxidaría al potencial del cátodo, y el aluminio formaría aleación con el litio en el ánodo.',
    eq:'Cu | grafito | separador | óxido | Al',
    campo:'173 µm', esc:aumento(ESC_CAPA/1e-6), radio:125 },
  { nom:'La red',         sub:'12 nm · ×4 600 millones',
    glosa:'El litio no se deposita: se mete entre los planos. Al cargar entra en el grafito y los planos se separan de 0,335 a 0,370 nm; al descargar vuelve al óxido. Los electrones nunca cruzan el electrolito, van por el circuito externo.',
    eq:'ánodo  LiC₆ → C₆ + Li⁺ + e⁻\ncátodo  Li₁₋ₓMO₂ + xLi⁺ + xe⁻ → LiMO₂',
    campo:'12 nm', esc:aumento((ESC_NM/10)/1e-9), radio:72 },
];

function pintarTramo(){
  const t = TRAMOS[tramo];
  document.getElementById('rotulo').textContent = t.nom;
  document.getElementById('glosa').textContent = t.glosa;
  document.getElementById('ecuacion').textContent = t.eq;
  document.getElementById('c-esc').textContent = t.esc;
  document.getElementById('c-campo').textContent = t.campo;
  gCelda.visible = tramo === 0;
  gCapas.visible = tramo === 1;
  gRed.visible   = tramo === 2;
  document.getElementById('b-desarmar').hidden = tramo !== 0;
  document.querySelectorAll('.peldano').forEach((b,i) =>
    b.setAttribute('aria-current', String(i === tramo)));
  radioObj = t.radio;
  document.getElementById('t-extra').textContent = tramo === 2 ? 'litio en ánodo' : 'capacidad';
}

function pintarCifras(){
  const v = tension();
  document.getElementById('c-v').textContent = v.toFixed(2).replace('.', ',') + ' V';
  document.getElementById('c-extra').textContent = tramo === 2
    ? Math.round(soc * N_SITIOS) + ' / ' + N_SITIOS
    : Math.round(soc * CELDA.mAh) + ' mAh';
  document.getElementById('soc').textContent =
    Math.round(soc*100) + ' % · ' + v.toFixed(2).replace('.', ',') + ' V';
  document.getElementById('relleno').style.width = (soc*100) + '%';
}

const esc = document.getElementById('escalera');
TRAMOS.forEach((t,i) => {
  const b = document.createElement('button');
  b.className = 'peldano'; b.type = 'button';
  b.innerHTML = `<b>${t.nom}</b><span>${t.sub}</span>`;
  b.addEventListener('click', () => { tramo = i; pintarTramo(); pintarCifras(); if (typeof colocarVR === 'function') colocarVR(); });
  esc.appendChild(b);
});

/* --------------------------- controles --------------------------- */
let radioObj = 120, radio = 120, theta = 0.7, phi = 1.15;
let arrastrando = false, px = 0, py = 0;
const lienzo = renderer.domElement;
lienzo.addEventListener('pointerdown', e => { arrastrando = true; px = e.clientX; py = e.clientY;
  lienzo.setPointerCapture(e.pointerId); });
lienzo.addEventListener('pointerup', e => { arrastrando = false;
  try { lienzo.releasePointerCapture(e.pointerId); } catch {} });
lienzo.addEventListener('pointermove', e => {
  if (!arrastrando) return;
  theta -= (e.clientX - px) * 0.0048;
  phi = Math.min(Math.PI-0.06, Math.max(0.06, phi - (e.clientY - py) * 0.0048));
  px = e.clientX; py = e.clientY;
});
lienzo.addEventListener('wheel', e => {
  e.preventDefault();
  radioObj = Math.min(360, Math.max(16, radioObj + e.deltaY * 0.09));
}, { passive:false });

function fijarCorriente(c){
  corriente = (corriente === c) ? 0 : c;
  document.getElementById('b-descarga').setAttribute('aria-pressed', String(corriente === -1));
  document.getElementById('b-carga').setAttribute('aria-pressed', String(corriente === 1));
}
document.getElementById('b-descarga').addEventListener('click', () => fijarCorriente(-1));
document.getElementById('b-carga').addEventListener('click', () => fijarCorriente(1));
document.getElementById('b-desarmar').addEventListener('click', e => {
  desarmando = desarmando === 1 ? -1 : 1;
  e.currentTarget.textContent = desarmando === 1 ? 'Armar' : 'Desarmar';
});
document.getElementById('b-etiquetas').addEventListener('click', e => {
  verRotulos = !verRotulos;
  e.currentTarget.setAttribute('aria-pressed', String(verRotulos));
});
document.getElementById('vel').addEventListener('input', e => {
  velocidad = +e.target.value;
  document.getElementById('v-vel').textContent = velocidad.toFixed(1).replace('.', ',') + '×';
});

try {
  const b = VRButton.createButton(renderer);
  document.getElementById('vrhost').appendChild(b);
} catch {}

addEventListener('resize', () => {
  camara.aspect = innerWidth/innerHeight; camara.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});


/* =====================================================================
   Controles dentro del visor.
   El panel de la página es HTML y el HTML no existe en modo inmersivo, así
   que adentro hace falta otro panel, dibujado como geometría, y los mandos
   como única entrada. El panel va pegado al mando izquierdo: se mira la
   mano y se lee, sin necesidad de apuntar ni de rayos de selección.
   ===================================================================== */
const POSICION_VR = [
  new THREE.Vector3(0, 0, 78),     // la celda, vista entera desde fuera
  new THREE.Vector3(0, 0, 96),     // el apilado
  new THREE.Vector3(0, 0, 46),     // la red, a un paso de entrar en ella
];

const mandos = [], empunaduras = [];
let gripIzq = null;

for (let i = 0; i < 2; i++){
  const m = renderer.xr.getController(i);
  const linea = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1.6)]),
    new THREE.LineBasicMaterial({ color:0x7ce3a6, transparent:true, opacity:0.5 }));
  m.add(linea);
  rig.add(m); mandos.push(m);

  const g = renderer.xr.getControllerGrip(i);
  const cuerpo = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.035, 0.1, 4, 8),
    new THREE.MeshStandardMaterial({ color:0x9fb0bd, roughness:0.5, metalness:0.4 }));
  cuerpo.rotation.x = Math.PI/2;
  g.add(cuerpo);
  rig.add(g); empunaduras.push(g);

  m.addEventListener('connected', e => {
    m.userData.mano = e.data.handedness;
    g.userData.mano = e.data.handedness;
    if (e.data.handedness === 'left' && gripIzq !== g){ gripIzq = g; gripIzq.add(panelVR); }
  });
}

/* --- panel de lectura, como textura de lienzo --- */
const lienzoVR = document.createElement('canvas');
lienzoVR.width = 620; lienzoVR.height = 420;
const ctxVR = lienzoVR.getContext('2d');
const texVR = new THREE.CanvasTexture(lienzoVR);
texVR.colorSpace = THREE.SRGBColorSpace;
const panelVR = new THREE.Mesh(
  new THREE.PlaneGeometry(0.21, 0.142),
  new THREE.MeshBasicMaterial({ map:texVR, transparent:true, depthTest:false }));
panelVR.position.set(0.035, 0.06, -0.04);
panelVR.rotation.set(-0.95, 0.25, 0.12);
panelVR.renderOrder = 20;

let refrescoVR = 0;
function pintarPanelVR(){
  const x = ctxVR, t = TRAMOS[tramo];
  x.clearRect(0,0,620,420);
  x.fillStyle = 'rgba(10,16,22,.93)';
  x.fillRect(0,0,620,420);
  x.strokeStyle = '#2b3946'; x.lineWidth = 3; x.strokeRect(1.5,1.5,617,417);

  x.fillStyle = '#7ce3a6';
  x.font = '700 40px Chivo, Helvetica, Arial, sans-serif';
  x.fillText(t.nom, 26, 56);
  x.fillStyle = '#8496a4';
  x.font = '400 26px "Chivo Mono", monospace';
  x.fillText(t.esc + '  ·  ' + t.campo, 26, 92);

  x.fillStyle = '#e8eef3';
  x.font = '500 34px "Chivo Mono", monospace';
  const v = tension().toFixed(2).replace('.', ',');
  x.fillText(Math.round(soc*100) + ' %   ' + v + ' V', 26, 146);

  // barra de carga
  x.fillStyle = '#243039'; x.fillRect(26, 164, 568, 14);
  x.fillStyle = corriente > 0 ? '#7ce3a6' : corriente < 0 ? '#c87f3e' : '#5d7180';
  x.fillRect(26, 164, 568*soc, 14);

  x.fillStyle = '#8496a4';
  x.font = '400 25px "Chivo Mono", monospace';
  const dir = corriente < 0 ? 'descargando  →  Li⁺ al cátodo'
            : corriente > 0 ? 'cargando  →  Li⁺ al ánodo'
            : 'en reposo';
  x.fillText(dir, 26, 214);
  if (tramo === 2) x.fillText('litio en ánodo  ' + Math.round(soc*N_SITIOS) + ' / ' + N_SITIOS, 26, 248);

  x.strokeStyle = '#2b3946'; x.beginPath(); x.moveTo(26, 272); x.lineTo(594, 272); x.stroke();
  x.fillStyle = '#6f8494';
  x.font = '400 23px "Chivo Mono", monospace';
  const ayuda = [
    'palanca izq   desplazarse',
    'palanca der   girar · subir y bajar',
    'gatillo  descargar      lateral  cargar',
    'A / X  escala siguiente      B / Y  anterior',
  ];
  ayuda.forEach((l,i) => x.fillText(l, 26, 306 + i*31));
  texVR.needsUpdate = true;
}

/* --- entrada de los mandos --- */
const antes = {};                       // estado previo de cada botón, por mano
let giroAcum = 0;
const adelanteVR = new THREE.Vector3(), ladoVR = new THREE.Vector3();

function flanco(mano, i, pulsado){
  const k = mano + i;
  const subida = pulsado && !antes[k];
  antes[k] = pulsado;
  return subida;
}

function controlVR(dt){
  const sesion = renderer.xr.getSession();
  if (!sesion) return;

  for (const fuente of sesion.inputSources){
    const g = fuente.gamepad;
    if (!g) continue;
    const mano = fuente.handedness;
    const ejes = g.axes || [];
    const ex = ejes[2] ?? ejes[0] ?? 0;
    const ey = ejes[3] ?? ejes[1] ?? 0;

    if (mano === 'left'){
      // desplazamiento en el plano, en la dirección en que se mira
      if (Math.abs(ex) > 0.15 || Math.abs(ey) > 0.15){
        camara.getWorldDirection(adelanteVR); adelanteVR.y = 0; adelanteVR.normalize();
        ladoVR.crossVectors(adelanteVR, camara.up).normalize();
        const v = dt * 26 * velocidad;
        rig.position.addScaledVector(adelanteVR, -ey * v);
        rig.position.addScaledVector(ladoVR, ex * v);
      }
    } else if (mano === 'right'){
      // giro a saltos: girar de forma continua marea
      if (Math.abs(ex) > 0.7){
        if (!giroAcum){ rig.rotateY(-Math.sign(ex) * Math.PI/6); giroAcum = 1; }
      } else giroAcum = 0;
      if (Math.abs(ey) > 0.15) rig.position.y -= ey * dt * 18 * velocidad;
    }

    const b = g.buttons || [];
    if (b[0] && flanco(mano, 0, b[0].pressed)) fijarCorriente(-1);
    if (b[1] && flanco(mano, 1, b[1].pressed)) fijarCorriente(1);
    if (b[4] && flanco(mano, 4, b[4].pressed)){
      tramo = (tramo + 1) % TRAMOS.length; pintarTramo(); pintarCifras(); colocarVR();
    }
    if (b[5] && flanco(mano, 5, b[5].pressed)){
      tramo = (tramo + TRAMOS.length - 1) % TRAMOS.length; pintarTramo(); pintarCifras(); colocarVR();
    }
  }
}

function colocarVR(){
  if (!renderer.xr.isPresenting) return;
  rig.position.copy(POSICION_VR[tramo]);
  rig.rotation.set(0,0,0);
}

renderer.xr.addEventListener('sessionstart', () => { colocarVR(); pintarPanelVR(); });

/* --------------------------- bucle --------------------------- */
const reloj = new THREE.Clock();
const qAux = new THREE.Quaternion();

renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.05);

  if (corriente){
    soc = Math.min(1, Math.max(0, soc + corriente * dt * velocidad * 0.055));
    if (soc === 0 || soc === 1) fijarCorriente(corriente);
    pintarCifras();
  }

  if (desarmando){
    desarmado = Math.min(1, Math.max(0, desarmado + desarmando * dt * 0.55));
    if (desarmado === 0 || desarmado === 1) desarmando = 0;
    const e = desarmado*desarmado*(3-2*desarmado);
    carcasa.position.y = e * CELDA.alto * 1.15;
    carcasa.children.forEach(c => { if (c.material) c.material.opacity = 1 - e*0.78; });
    carcasa.traverse(o => { if (o.material){ o.material.transparent = e > 0.01; } });
    rollo.visible = e > 0.02;
    rollo.scale.setScalar(0.6 + 0.4*e);
    rollo.rotation.y += dt * 0.25;
  }

  if (tramo === 2){ dibujarRed(); moverIones(dt); }
  if (tramo === 0 && !desarmando && !desarmado) gCelda.rotation.y += dt * 0.22;
  if (tramo === 1) gCapas.rotation.y = Math.sin(performance.now()*0.00013) * 0.5;

  for (const r of listaRotulos){
    r.visible = verRotulos;
    r.quaternion.copy(camara.quaternion);
    if (r.parent && r.parent !== escena){
      r.parent.getWorldQuaternion(qAux);
      r.quaternion.premultiply(qAux.invert());
    }
  }

  if (renderer.xr.isPresenting){
    controlVR(dt);
    refrescoVR -= dt;
    if (refrescoVR <= 0){ pintarPanelVR(); refrescoVR = 0.2; }
  }

  radio += (radioObj - radio) * Math.min(1, dt*4);
  if (!renderer.xr.isPresenting){
    camara.position.set(
      radio*Math.sin(phi)*Math.cos(theta),
      radio*Math.cos(phi),
      radio*Math.sin(phi)*Math.sin(theta));
    camara.lookAt(0,0,0);
  }
  renderer.render(escena, camara);
});

dibujarRed();
pintarTramo();
pintarCifras();
const cargando = document.getElementById('cargando');
cargando.style.opacity = '0';
setTimeout(() => cargando.remove(), 600);
</script>
